name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux
            qt_arch: linux_gcc_64
          - os: windows-2022
            preset: windows-msvc
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libvulkan-dev qpdf poppler-utils
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'
      - name: Windows independent PDF tools
        if: runner.os == 'Windows'
        run: choco install qpdf poppler --yes --no-progress
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Configure
        # Test-only packages: font generation and independent PDFium rendering.
        run: python -m pip install -r tests/requirements.txt
      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test engine and CLI
        run: ctest --preset ${{ matrix.preset }}
      - name: Validate generated PDFs independently
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for file in build/linux/tests/corpus/basic.pdf build/linux/tests/corpus/nested.pdf build/linux/tests/corpus/embedded.pdf; do
            qpdf --check "$file"
          done
          pdftotext build/linux/tests/corpus/basic.pdf build/linux/tests/basic.txt
          python3 -c "from pathlib import Path; assert 'Hello yolopdf' in Path('build/linux/tests/basic.txt').read_text()"

      - name: Verify installed layout and package source
        run: |
          cmake --install build/${{ matrix.preset }} --prefix build/package
          python tools/package_source.py --output build/yolopdf-source.tar.gz --notices build/dependency-notices
      - name: Windows Qt corresponding source
        if: runner.os == 'Windows'
        run: python tools/fetch_qt_source.py --output build/qt-source
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          cpack --config build/windows-msvc/CPackConfig.cmake -G NSIS
      - uses: actions/upload-artifact@v4
        with:
          name: yolopdf-${{ matrix.preset }}-preview-and-source
          path: |
            build/yolopdf-source.tar.gz
            build/dependency-notices/**
            build/qt-source/**
            yolopdf-*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          cache: true
      - name: Configure Android arm64
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          test -n "$QT_HOST_PATH"
          cmake --preset android-arm64 -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build APK and CLI
        run: cmake --build --preset android-arm64 --target apk yolopdf-cli
      - name: Matching application and Qt source
        run: |
          python3 tools/package_source.py --output build/yolopdf-source.tar.gz --notices build/dependency-notices
          python3 tools/fetch_qt_source.py --output build/qt-source
      - name: Build preview AAB
        run: cmake --build --preset android-arm64 --target aab
      - uses: actions/upload-artifact@v4
        with:
          name: yolopdf-android-arm64-debug
          path: |
            build/android-arm64/android-build/build/outputs/apk/**/*.apk
            build/android-arm64/android-build/build/outputs/bundle/**/*.aab
            build/yolopdf-source.tar.gz
            build/qt-source/**
            build/dependency-notices/**
          if-no-files-found: error

  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qpdf poppler-utils libgl1-mesa-dev
          python -m pip install -r tests/requirements.txt
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_x86_64
          cache: true
      - name: Build emulator test APK and native driver
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          cmake --preset android-x86_64 -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DYOLOPDF_ANDROID_TEST_HOOKS=ON
          cmake --build --preset android-x86_64 --target apk yolopdf-cli
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash tests/android/run-emulator.sh build/android-x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-stage1-results
          path: build/android-x86_64/*-*.pdf

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare matching source
        run: python3 tools/package_source.py --output build/flatpak/yolopdf-source.tar.gz --notices build/flatpak/notices
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: yolopdf.flatpak
          manifest-path: packaging/flatpak/org.yolopdf.app.json
          cache-key: flatpak-builder-${{ github.sha }}
